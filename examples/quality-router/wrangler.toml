name = "styrr-quality-router"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

# wrangler kv namespace create MODEL_RANKING  → paste binding + id here
[[kv_namespaces]]
binding = "MODEL_RANKING"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[triggers]
crons = ["0 3 * * *"]

[vars]
CACHE_TTL = "172800"